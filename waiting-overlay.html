<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#1d1d1f}
.waiting{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#f5f5f7;border:1px solid #e4e6eb;border-radius:24px;padding:16px}
canvas{width:280px;max-width:88%;height:190px;flex-shrink:1;min-height:60px}.label{font-size:14px;color:#6e6e73;letter-spacing:1px}button{height:32px;min-height:32px;padding:0 18px;background:white;border:1px solid #d9dde5;border-radius:12px;color:#a94c4c;font:12px "Segoe UI","Microsoft YaHei",sans-serif;cursor:pointer}button:hover{background:#fff5f5}button:focus-visible{outline:3px solid #0071e34d;outline-offset:2px}
</style></head><body><div id="waiting" class="waiting" role="status" aria-label="等待结果"><canvas id="surface" aria-hidden="true"></canvas><div class="label">等待结果</div><button id="stop" type="button">停止生成</button></div>
<script src="waiting-animation.js"></script><script>
function setup(component){
 const stop=document.getElementById('stop');
 const animation=createAileronWaitingAnimation(document.getElementById('surface'),document.getElementById('waiting'),{disabled:false});
 function render(){const data=component.Data;if(data&&typeof data==='object')animation.update(data);}
 render();component.addEventListener('DataChanged',render);
 stop.addEventListener('click',function(){component.Data={action:'stopGeneration',nonce:Date.now()};});
}
</script></body></html>
