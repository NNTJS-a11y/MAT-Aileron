<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font:13px "Segoe UI","Microsoft YaHei",sans-serif;background:#f5f5f7}input{box-sizing:border-box;width:100%;height:100%;border:1px solid #d5d9e0;border-radius:12px;padding:8px 12px;background:#fff;color:#1d1d1f;outline:none;font:inherit;transition:border-color .15s,box-shadow .15s}input:focus{border-color:#0071e3;box-shadow:inset 0 0 0 1px #0071e3}
@media(prefers-reduced-motion:reduce){input{transition:none}}
</style></head>
<body><input id="key" type="password" autocomplete="off" aria-label="API Key" placeholder="留空则读取 API Key 环境变量">
<script>
function setup(component) {
    const field = document.getElementById('key');
    field.value = typeof component.Data === 'string' ? component.Data : '';
    field.addEventListener('input', function () { component.Data = field.value; });
    component.addEventListener('DataChanged', function () {
        field.value = typeof component.Data === 'string' ? component.Data : '';
    });
}
</script></body></html>
