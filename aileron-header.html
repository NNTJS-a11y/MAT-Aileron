<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{color-scheme:light}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#1d1d1f}
.bar{height:100%;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:2px 0}.brand{min-width:0;display:flex;gap:12px;align-items:center}.mark{flex:none;width:40px;height:40px;display:grid;place-items:center;background:linear-gradient(145deg,#2488f5,#0864cf);border-radius:13px;box-shadow:inset 0 1px 0 #ffffff38,0 3px 10px #0071e31a}.mark svg{width:32px;height:32px}.words{min-width:0}h1{font-size:20px;letter-spacing:-.55px;font-weight:600;line-height:1.3;margin:0;white-space:nowrap}.sub{font-size:11px;color:#86868b;margin-top:5px;letter-spacing:.3px}
button{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border:1px solid #dce3ec;border-radius:14px;background:#fff;color:#1d1d1f;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;box-shadow:0 2px 5px #00000004;transition:background .16s,transform .12s,box-shadow .16s}button svg{width:16px;height:16px;color:#0071e3}button:hover{background:#eaf3ff;box-shadow:0 4px 12px #0071e310}button:active{transform:scale(.97)}button:focus-visible{outline:3px solid #0071e34d;outline-offset:2px}
@media(max-width:900px){h1{font-size:16px;letter-spacing:-.35px}.mark{width:34px;height:34px;border-radius:11px}.brand{gap:9px}button{padding:0 13px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
button:disabled{opacity:.45;cursor:default}button:disabled:hover{background:#fff;box-shadow:none}
</style></head><body><div class="bar"><div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none" data-logo="cactus"><path d="M17 33V24h-5a7 7 0 0 1-7-7v-4a3 3 0 0 1 6 0v4a1 1 0 0 0 1 1h5V8a4 4 0 0 1 8 0v15h3a1 1 0 0 0 1-1v-8a3 3 0 0 1 6 0v8a7 7 0 0 1-7 7h-3v4a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2Z" fill="white"/></svg></div><div class="words"><h1>MAT Aileron | Steer Your Laboratory</h1><div class="sub" id="release">MATLAB WORKSPACE</div></div></div><button id="api" type="button" aria-label="API设置"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 3-.7 2.4-2 .9L4 5.7 2.5 8.3 4.2 10v2l-1.7 1.7L4 16.3l2.3-.6 2 .9L9 19h3l.7-2.4 2-.9 2.3.6 1.5-2.6-1.7-1.7v-2l1.7-1.7L17 5.7l-2.3.6-2-.9L12 3H9Z" transform="translate(1 1)" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="11.5" cy="12" r="2.6" stroke="currentColor" stroke-width="1.4"/></svg>API设置</button></div>
<script>
function setup(component){
 const release=document.getElementById('release');
 const api=document.getElementById('api');
 function render(){const data=component.Data;if(data&&typeof data==='object'){if(typeof data.release==='string')release.textContent=data.release+'  /  MATLAB WORKSPACE';api.disabled=!!data.generating;}}
 render();component.addEventListener('DataChanged',render);
 api.addEventListener('click',function(){component.Data={action:'apiSettings',nonce:Date.now()};});
}
</script></body></html>
